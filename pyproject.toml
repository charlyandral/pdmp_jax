[project]
name = "pdmp_jax"
version = "0.1.1"
description = "A general PDMP sampler in JAX"
authors = [{ name = "Charly Andral", email = "andral@ceremade.dauphine.fr" }]
requires-python = "~=3.10"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "jax==0.6.2",
    "jaxlib==0.6.2",
    "jaxtyping>=0.2.33",
    "jax-tqdm>=0.2.2",
    "matplotlib>=3.10",
    "seaborn>=0.13.2",
]

[project.urls]
Repository = "https://github.com/charlyandral/pdmp_jax"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipython>=8.37.0",
    "ipywidgets>=8.1.7",
    "joblib>=1.5.3",
    "joblib-stubs>=1.5.2.0.20250831",
    "jupyter>=1.1.1",
    "mypy>=1.18.1",
    "pytest>=8.4.1",
    "ruff>=0.13.0",
    "types-tqdm>=4.67.0.20250809",
]


[tool.ruff.lint]
future-annotations = true
ignore = ["F722","E402"]
extend-select = ["TC"]
extend-safe-fixes = ["TC001","TC002","TC003","TC004","TC005","RET504"]

[mypy]
strict = true
